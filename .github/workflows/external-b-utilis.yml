name: PEERFIX EXT-B C. utilis external validation

on:
  push:
    branches:
      - external/peerfix-ext-mogii-utilis-2026-09-16
    paths:
      - '.external/RUN_EXT_B'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gate03.txt
      - name: Install frozen qualified environment
        run: pip install -r requirements-gate03.txt
      - name: Verify frozen Core implementation unchanged
        run: |
          git cat-file -e 0d5a73d128fe374c8165f3b84a2412ac9b02cbc1^{commit}
          git diff --exit-code 0d5a73d128fe374c8165f3b84a2412ac9b02cbc1 -- peerfix_core requirements-gate03.txt
      - name: Run Core plus external adapter contract tests
        run: pytest -q tests/test_peerfix_core_contract.py tests/test_gate04_provenance_roundtrip.py tests/test_gate04_tabddpm_conformance.py tests/test_external_validation_contract.py
      - name: EXT-B Y1/Y3 fail-closed preflight and Y2 negative-control block
        run: |
          python scripts/external_validation_runner.py --phase preflight --dataset ext_b_y1
          python scripts/external_validation_runner.py --phase preflight --dataset ext_b_y3
          python scripts/external_validation_runner.py --phase preflight --dataset ext_b_y2 | tee /tmp/ext_b_y2_preflight.json
          grep -q '"status": "BLOCKED_BY_MODELABILITY"' /tmp/ext_b_y2_preflight.json || { echo 'ERROR: Y2 negative-control did not report BLOCKED_BY_MODELABILITY' >&2; exit 1; }
          echo 'Y2 correctly blocked: no synthetic generation authorized.'

  scientific:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        dataset: [ext_b_y1, ext_b_y3]
        generator: [gaussian_copula, ctgan, tvae, tabddpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gate03.txt
      - name: Install frozen qualified environment
        run: pip install -r requirements-gate03.txt
      - name: Recheck block preflight
        run: python scripts/external_validation_runner.py --phase preflight --dataset ${{ matrix.dataset }}
      - name: Leakage-free utility — row CV
        run: python scripts/external_validation_runner.py --phase utility --dataset ${{ matrix.dataset }} --generator ${{ matrix.generator }} --geometry row --output-dir outputs/external/${{ matrix.dataset }}/${{ matrix.generator }}/utility/row
      - name: Leakage-free utility — grouped-condition CV
        run: python scripts/external_validation_runner.py --phase utility --dataset ${{ matrix.dataset }} --generator ${{ matrix.generator }} --geometry grouped_condition --output-dir outputs/external/${{ matrix.dataset }}/${{ matrix.generator }}/utility/grouped_condition
      - name: Full realizations, fidelity, DCR and matched-n ICD
        run: python scripts/external_validation_runner.py --phase full --dataset ${{ matrix.dataset }} --generator ${{ matrix.generator }} --output-dir outputs/external/${{ matrix.dataset }}/${{ matrix.generator }}/full
      - name: Upload generator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-b-${{ matrix.dataset }}-${{ matrix.generator }}-${{ github.sha }}
          path: outputs/external
          if-no-files-found: error
          retention-days: 60

  audit:
    needs: scientific
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gate03.txt
      - name: Install frozen qualified environment
        run: pip install -r requirements-gate03.txt
      - name: Download all EXT-B artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: external-b-*-${{ github.sha }}
          path: outputs/external
          merge-multiple: true
      - name: Audit Y1 completeness, hashes, seeds, leakage coverage and TRTR invariance
        run: python scripts/external_audit.py --dataset ext_b_y1 --root outputs/external --output-dir audit_y1
      - name: Audit Y3 completeness, hashes, seeds, leakage coverage and TRTR invariance
        run: python scripts/external_audit.py --dataset ext_b_y3 --root outputs/external --output-dir audit_y3
      - name: Upload EXT-B audit and scientific summaries
        uses: actions/upload-artifact@v4
        with:
          name: external-b-audit-${{ github.sha }}
          path: |
            audit_y1/
            audit_y3/
          if-no-files-found: error
          retention-days: 90
