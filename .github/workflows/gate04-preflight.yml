name: PEERFIX Gate 0.4 preflight

on:
  push:
    branches:
      - resume/gate0.4-clean-derivation-2026-09-13
    paths:
      - 'peerfix_core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/PEERFIX_CORE_v1.0_PRE_FREEZE_REV2.yaml'
      - 'config/PEERFIX_CORE_v1.0_PRE_FREEZE_REV3_AMENDMENT.yaml'
      - 'config/CURRENT_PEERFIX_CORE_PROTOCOL.md'
      - 'data/derivation/peerfix2_historical_manuscript_dataset.csv'
      - 'requirements-gate03.txt'
      - '.github/workflows/gate04-preflight.yml'
  workflow_dispatch:

concurrency:
  group: gate04-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gate03.txt
      - name: Install qualified environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-gate03.txt
      - name: Core contract
        run: python -m pytest -q tests/test_peerfix_core_contract.py
      - name: Gate 0.4 protocol preflight
        run: python -m pytest -q tests/test_gate04_preflight.py
      - name: Gate 0.4 sensitivity contract
        run: python -m pytest -q tests/test_gate04_sensitivity.py
      - name: Gate 0.4 fidelity contract
        run: python -m pytest -q tests/test_gate04_fidelity.py
      - name: Gate 0.4 TabDDPM conformance contract
        run: python -m pytest -q tests/test_gate04_tabddpm_conformance.py
      - name: Gate 0.4 legacy ICD comparability contract
        run: python -m pytest -q tests/test_gate04_legacy_icd.py
      - name: Recheck four real generator integrations
        run: python -m pytest -q tests/test_gate03_generators.py
      - name: Runner fail-closed preflight
        run: python scripts/gate04_derivation_runner.py --phase preflight
      - name: Runner smoke — baseline utility
        run: |
          python scripts/gate04_derivation_runner.py \
            --phase utility \
            --generator gaussian_copula \
            --scenario baseline_0pct \
            --geometry row \
            --smoke \
            --output-dir /tmp/gate04_smoke/utility_base
          test -f /tmp/gate04_smoke/utility_base/completion.json
      - name: Runner smoke — sensitivity utility
        run: |
          python scripts/gate04_derivation_runner.py \
            --phase utility \
            --generator gaussian_copula \
            --scenario sensitivity_1pct \
            --geometry row \
            --smoke \
            --output-dir /tmp/gate04_smoke/utility_sens
          test -f /tmp/gate04_smoke/utility_sens/completion.json
      - name: Runner smoke — grouped-condition utility
        run: |
          python scripts/gate04_derivation_runner.py \
            --phase utility \
            --generator gaussian_copula \
            --scenario baseline_0pct \
            --geometry grouped_condition \
            --smoke \
            --output-dir /tmp/gate04_smoke/utility_grouped
          test -f /tmp/gate04_smoke/utility_grouped/completion.json
      - name: Runner smoke — full-realisation sensitivity
        run: |
          python scripts/gate04_derivation_runner.py \
            --phase full_realisations \
            --generator gaussian_copula \
            --scenario sensitivity_1pct \
            --smoke \
            --output-dir /tmp/gate04_smoke/full_sens
          test -f /tmp/gate04_smoke/full_sens/completion.json
          test -f /tmp/gate04_smoke/full_sens/dcr_values.csv
          test -f /tmp/gate04_smoke/full_sens/icd_legacy_effects.csv
