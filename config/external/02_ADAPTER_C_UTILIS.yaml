adapter:
  id: PEERFIX_EXT_B_C_UTILIS_v1
  role: secondary_external_multiresponse_and_modelability_challenge
  frozen_core_commit: 0d5a73d128fe374c8165f3b84a2412ac9b02cbc1
  preregistration_status: frozen_before_generator_execution

provenance:
  source_workbook: Dados_Livia.xlsx
  sha256: 8a8171dd0275d77651c14e3d963f6332995ef3c15d13db949dec17717d8486d1
  source_status: author_coauthor_supplied_original_analysis_workbook
  correspondence_status: coauthor_Peterson_supplied_dataset_with_corresponding_author_Jenyffer_in_thread
  public_raw_redistribution: not_assumed

experimental_unit:
  unit: DOE_run
  n_runs: 19
  responses_available_as_run_level_means: [Y1_surface_tension, Y2_E24_motor_oil, Y3_E24_canola]
  original_within_run_replicates_available_for_Y1_Y2_Y3: false
  promote_response_means_to_additional_independent_rows: false

design:
  geometry: full_2pow4_factorial_plus_3_center_runs
  factorial_points: 16
  center_points: 3
  axial_points: 0
  coded_levels: [-1, 0, 1]
  factors:
    X1: {name: licuri_oil}
    X2: {name: glucose}
    X3: {name: yeast_extract, real_range_g_L: [2, 8]}
    X4: {name: ammonium_nitrate, real_range_g_L: [1, 3]}
  source_text_correction:
    note: section_3_2_and_Table_2_legend_swapped_X3_X4
    authoritative_mapping: X3_yeast_extract_X4_ammonium_nitrate
    numerical_models_affected: false

response_blocks:
  Y1_surface_tension:
    role: primary_positive_external_block
    source_model: reduced_linear_plus_interaction
    source_fingerprint:
      - {term: X1, sign: negative}
      - {term: X1:X4, sign: positive}
    source_model_R2: 0.5512
    source_global_p: 0.00164
    source_lack_of_fit_p: 0.59024
    modelability_expected: PASS
  Y2_E24_motor_oil:
    role: prespecified_negative_control_modelability_block
    source_global_p: 0.69
    source_valid_factor_response_relation: false
    interpretation: core_should_not_manufacture_strong_confirmed_domain_relation
    modelability_expected: RESTRICT_OR_FAIL_RELATION_IDENTIFIABILITY
  Y3_E24_canola:
    role: secondary_domain_concordance_block
    source_fingerprint:
      - {term: X2:X3, sign: positive}
    source_model_R2_approx: 0.321
    source_global_p_approx: 0.0114
    modelability_expected: CONDITIONAL_PASS

auxiliary_blocks:
  growth_curve:
    role: descriptive_or_structured_time_block
    treat_timepoints_as_iid_tabular_rows: false
  CMC_curve:
    role: descriptive_or_curve_modelability_block
    treat_concentration_points_as_iid_biological_replicates: false

validation:
  primary_cv: {method: repeated_kfold, n_splits: 5, n_repeats: 10}
  structural_cv:
    method: repeated_grouped_condition_kfold
    n_splits: 5
    n_repeats: 10
    group: exact_factor_tuple
    keep_center_replicates_together: true
  n_synthetic: 140
  matched_effective_n_for_icd: 19
  tuning_on_external_outcomes: prohibited

modelability_gate:
  source_traceable: true
  experimental_unit_defined: true
  support_sufficient_for_run_level_DOE: true
  response_specific_relation_identifiability: required
  decision: PASS_WITH_RESPONSE_SPECIFIC_GATES
